# Production configuration for Eco-Return Ireland Backend
# All sensitive values MUST be provided via environment variables

server:
  port: ${PORT:8080}

spring:
  application:
    name: eco-return-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ecoreturn.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    root: WARN
    com.ecoreturn: INFO
    org.springframework.web: WARN
    org.springframework.data.redis: WARN
    org.springframework.jdbc: WARN
    com.zaxxer.hikari: WARN
    org.mybatis: WARN
    com.baomidou.mybatisplus: WARN

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://isitfull.ie,https://www.isitfull.ie}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600000
    refresh-token-expiry: 2592000000
  location-iq:
    api-key: ${LOCATIONIQ_API_KEY}
  google:
    geocoding-api-key: ${GOOGLE_GEOCODING_API_KEY}
  mapbox:
    access-token: ${MAPBOX_ACCESS_TOKEN}
    monthly-limit: 45000
  firebase:
    service-account: ${FIREBASE_SERVICE_ACCOUNT}
  oci:
    object-storage:
      enabled: ${OCI_STORAGE_ENABLED:true}
      region: ${OCI_REGION:uk-london-1}
      namespace: ${OCI_NAMESPACE}
      bucket: ${OCI_BUCKET:isitfull-feedback}
      auth-type: ${OCI_AUTH_TYPE:instance_principal}
      config-file: ${OCI_CONFIG_FILE:~/.oci/config}
      profile: ${OCI_PROFILE:DEFAULT}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
